<title>Forja — Montador de Itens</title>
<script>
  // O Montador de Itens mudou de endereço em 30/10/2026: brelgo.github.io/forja/.
  // Este repositório (o nome antigo) só redireciona, levando o caminho, os
  // parâmetros e o # do link — assim um link antigo de build abre a mesma build.
  (function () {
    var novo = "https://brelgo.github.io/forja/";
    var resto = location.pathname.replace(/^\/montador_de_itens_lol\/?/, "");
    location.replace(novo + resto + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="1; url=https://brelgo.github.io/forja/">

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1512; color: #e8d9bd;

</style>
</head>
